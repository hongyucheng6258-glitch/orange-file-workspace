[package]
name = "orange"
version = "0.1.0"
description = "Orange - 本地文件工作台"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "file_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
uuid = { version = "1.24.1", features = ["v4"] }
notify = "8.2.0"
sha2 = "0.11.0"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
sysinfo = "0.33"
winreg = "0.52"
# 内置终端：Windows ConPTY 跨平台抽象（wezterm 出品）。
# 固定 0.8.x：0.9 引入 PSEUDOCONSOLE_INHERIT_CURSOR，ConPTY 启动时阻塞 stdout 等待宿主响应。
portable-pty = "0.8.1"
# 项目运行：pyproject.toml 脚本表解析（仅诊断）、确认协议常量时间比较。
toml = "0.8"
subtle = "2"
drag = "2.1.1"
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Com",
    "Win32_System_Environment",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_Security",
    "Win32_System_Search",
    "Win32_System_Services",
    "Win32_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_System_Ioctl",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61"

